<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050505" />
  <title>Nate Savard Entry Gate</title>
  <style>
    :root {
      --bg: #050505;
      --ink: #f5efe6;
      --sand: #dec39a;
      --gold: #d7ab52;
      --line: rgba(255, 232, 188, 0.22);
      --entry-portrait-image: url("nate-savard-warm-portrait-3000(1).png");
      --entry-storefront-image: url("IMG_6721.jpg");
      --entry-third-image: url("nate-savard-bg-3.png");
      --entry-fourth-image: url("nate savard speedway (1).png");
      --orb-travel: clamp(110px, 15vh, 170px);
      --mono: "Courier New", monospace;
      --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      color: var(--ink);
      font-family: var(--serif);
    }

    html {
      position: relative;
      background: var(--bg);
      isolation: isolate;
    }

    html::before,
    html::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      transform-origin: center center;
    }

    html::before {
      background: var(--entry-portrait-image) 38% center / cover no-repeat;
      transform: scale(1.04);
      filter: saturate(0.96) contrast(1.02) brightness(0.98);
      opacity: 0;
      animation: portraitFloat 13s ease-in-out infinite, backgroundSwapPortrait 36s ease-in-out infinite;
    }

    html::after {
      background: var(--entry-storefront-image) center center / cover no-repeat;
      transform: scale(1.06);
      filter: saturate(0.92) contrast(1.03) brightness(0.82);
      opacity: 0;
      animation: storefrontFloat 15s ease-in-out infinite, backgroundSwapStorefront 36s ease-in-out infinite;
    }

    .entry-third-backdrop {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      transform-origin: center center;
      background: var(--entry-third-image) center center / cover no-repeat;
      transform: scale(1.05);
      filter: saturate(0.9) contrast(1.02) brightness(0.84);
      opacity: 0.58;
      animation: thirdFloat 14.5s ease-in-out infinite, backgroundSwapThird 36s ease-in-out infinite;
    }

    .entry-fourth-backdrop {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      transform-origin: center center;
      background: var(--entry-fourth-image) center center / cover no-repeat;
      transform: scale(1.045);
      filter: saturate(0.88) contrast(1.02) brightness(0.86);
      opacity: 0;
      animation: fourthFloat 16s ease-in-out infinite, backgroundSwapFourth 36s ease-in-out infinite;
    }

    body {
      position: relative;
      z-index: 1;
      background: transparent;
      isolation: isolate;
    }

    .sound-player {
      position: fixed;
      top: 10px;
      left: 50%;
      z-index: 30;
      width: min(1120px, calc(100vw - 20px));
      transform: translateX(-50%);
      color: #e9e7d7;
      font-family: var(--mono);
      border: 1px solid rgba(225, 230, 221, 0.54);
      border-radius: 5px;
      background:
        linear-gradient(180deg, rgba(104, 108, 104, 0.96) 0, rgba(38, 40, 39, 0.98) 48%, rgba(13, 14, 14, 0.98) 50%, rgba(45, 47, 45, 0.98) 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.42),
        inset 0 -1px 0 rgba(0, 0, 0, 0.9),
        0 8px 24px rgba(0, 0, 0, 0.52);
      overflow: hidden;
    }

    .sound-player::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px 4px),
        linear-gradient(90deg, rgba(215, 171, 82, 0.08), transparent 24%, transparent 76%, rgba(215, 171, 82, 0.08));
      mix-blend-mode: screen;
    }

    .sound-player__inner {
      position: relative;
      display: grid;
      grid-template-columns: auto auto minmax(220px, 1fr) minmax(170px, 0.52fr);
      gap: 8px;
      align-items: center;
      min-height: 54px;
      padding: 6px 8px;
    }

    .sound-player__brand {
      display: grid;
      gap: 2px;
      min-width: 88px;
      padding: 3px 8px 3px 4px;
      border-right: 1px solid rgba(0, 0, 0, 0.66);
      text-shadow: 0 1px 0 #000;
    }

    .sound-player__brand strong {
      color: #f0d28c;
      font-size: 11px;
      letter-spacing: 0.18em;
      white-space: nowrap;
    }

    .sound-player__brand small {
      color: rgba(235, 237, 225, 0.64);
      font-size: 7px;
      letter-spacing: 0.26em;
    }

    .sound-player__controls {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .sound-player__button {
      width: 30px;
      height: 27px;
      display: grid;
      place-items: center;
      padding: 0;
      color: #e7e6dc;
      font: 700 12px/1 var(--mono);
      border: 1px solid rgba(225, 230, 221, 0.42);
      border-radius: 2px;
      background: linear-gradient(180deg, #6d706c, #262827 56%, #171818);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.27),
        0 1px 0 rgba(0, 0, 0, 0.9);
      cursor: pointer;
    }

    .sound-player__button:hover,
    .sound-player__button:focus-visible {
      color: #ffe2a0;
      border-color: rgba(255, 221, 153, 0.68);
      outline: none;
    }

    .sound-player__button:active {
      transform: translateY(1px);
      background: linear-gradient(180deg, #202221, #4a4d4a);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    .sound-player__display {
      min-width: 0;
      padding: 5px 8px 4px;
      border: 1px solid #060806;
      border-radius: 2px;
      background:
        repeating-linear-gradient(0deg, rgba(138, 255, 106, 0.025) 0 1px, transparent 1px 3px),
        linear-gradient(180deg, #071109, #020503);
      box-shadow:
        inset 0 0 9px rgba(0, 0, 0, 0.96),
        0 1px 0 rgba(255, 255, 255, 0.16);
    }

    .sound-player__track-row {
      display: flex;
      gap: 9px;
      align-items: baseline;
      min-width: 0;
    }

    .sound-player__track-number,
    .sound-player__status,
    .sound-player__time {
      color: #a7f57d;
      text-shadow: 0 0 7px rgba(134, 255, 101, 0.42);
    }

    .sound-player__track-number {
      font-size: 12px;
      font-weight: 700;
    }

    .sound-player__track-title {
      min-width: 0;
      overflow: hidden;
      color: #c5ff9e;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-overflow: ellipsis;
      text-shadow: 0 0 7px rgba(134, 255, 101, 0.32);
      white-space: nowrap;
    }

    .sound-player__display-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 3px;
      font-size: 8px;
      letter-spacing: 0.11em;
    }

    .sound-player__status {
      opacity: 0.74;
    }

    .sound-player__timeline {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 9px;
      align-items: center;
    }

    .sound-player__range {
      width: 100%;
      height: 3px;
      margin: 0;
      border-radius: 999px;
      background: #080908;
      accent-color: #d4b368;
      cursor: pointer;
    }

    .sound-player__range:disabled {
      opacity: 0.34;
      cursor: default;
    }

    .sound-player__volume {
      display: grid;
      grid-template-columns: auto minmax(58px, 84px);
      gap: 6px;
      align-items: center;
      color: rgba(235, 237, 225, 0.68);
      font-size: 8px;
      letter-spacing: 0.14em;
    }

    body::before,
    body::after,
    .entry-gate::before,
    .entry-gate::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      z-index: 0;
      background:
        linear-gradient(rgba(0, 0, 0, 0.26), rgba(0, 0, 0, 0.46)),
        radial-gradient(circle at 74% 16%, rgba(255, 225, 176, 0.08), rgba(0, 0, 0, 0) 24%),
        radial-gradient(circle at 14% 82%, rgba(245, 235, 210, 0.06), rgba(0, 0, 0, 0) 28%);
    }

    body::after {
      z-index: 1;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.26), rgba(0, 0, 0, 0.03) 18%, rgba(0, 0, 0, 0.03) 82%, rgba(0, 0, 0, 0.26)),
        linear-gradient(180deg, rgba(4, 4, 4, 0.03) 0%, rgba(4, 4, 4, 0.0) 24%, rgba(4, 4, 4, 0.0) 76%, rgba(4, 4, 4, 0.54) 100%),
        repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.012) 0,
          rgba(255, 255, 255, 0.012) 1px,
          transparent 2px,
          transparent 5px
        );
      mix-blend-mode: screen;
      opacity: 0.6;
    }

    .entry-gate {
      position: relative;
      z-index: 2;
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-columns: 1fr minmax(16px, 44px) 1fr;
      align-items: center;
      justify-items: center;
      padding: clamp(84px, 10vh, 108px) clamp(18px, 3vw, 40px) clamp(18px, 3vw, 40px);
      isolation: isolate;
    }

    .entry-gate::before {
      z-index: -2;
      background:
        radial-gradient(
          circle at 47% 30%,
          rgba(255, 255, 255, 0.10) 0%,
          rgba(255, 236, 196, 0.08) 4.5%,
          rgba(255, 205, 120, 0.05) 10%,
          rgba(0, 0, 0, 0) 22%
        ),
        radial-gradient(
          ellipse at 46% 31%,
          rgba(255, 220, 150, 0.08) 0%,
          rgba(255, 220, 150, 0.04) 11%,
          rgba(0, 0, 0, 0) 28%
        );
      mix-blend-mode: screen;
      opacity: 0.6;
      animation: shirtPulse 8.5s ease-in-out infinite;
    }

    .entry-gate::after {
      z-index: -1;
      background:
        radial-gradient(circle at 50% 48%, rgba(255, 214, 120, 0.04), transparent 32%),
        radial-gradient(circle at 50% 56%, rgba(255, 255, 255, 0.02), transparent 20%);
    }

    .path {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      width: min(30vw, 420px);
      text-align: center;
      text-decoration: none;
      color: var(--ink);
      transform: translateY(2vh);
      transition: transform 0.28s ease, filter 0.28s ease;
    }

    .path:hover {
      transform: translateY(calc(2vh - 8px));
    }

    .path-official-logo-stack {
      position: relative;
      display: block;
      width: min(100%, clamp(120px, 13vw, 210px));
      transition: transform 0.28s ease;
      isolation: isolate;
    }

    .path-official-logo {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
    }

    .path-official-logo.shadow {
      position: absolute;
      inset: 0;
      z-index: 1;
      opacity: 0.34;
      filter:
        blur(10px)
        brightness(0.18)
        saturate(0)
        drop-shadow(0 0 14px rgba(0, 0, 0, 0.36));
      transform: translate3d(-8px, 8px, 0) scale(1.05);
      mix-blend-mode: multiply;
      animation: envyShadowDrift 18s ease-in-out infinite;
    }

    .path-official-logo.base {
      position: relative;
      z-index: 2;
      opacity: 0.72;
      filter:
        grayscale(1)
        brightness(0.64)
        contrast(1.04)
        drop-shadow(0 8px 18px rgba(0, 0, 0, 0.34));
      animation: envyBaseFade 14s ease-in-out infinite;
    }

    .path-official-logo.white {
      position: absolute;
      inset: 0;
      z-index: 3;
      opacity: 0.12;
      filter:
        brightness(1.18)
        saturate(0)
        contrast(1.08)
        drop-shadow(0 0 10px rgba(255, 243, 217, 0.12))
        drop-shadow(0 0 28px rgba(255, 243, 217, 0.12));
      animation: envyWhiteFade 14s ease-in-out infinite;
    }

    .path:hover .path-official-logo-stack {
      transform: translateY(-2px) scale(1.015);
    }

    .path-kicker,
    .path-route,
    .center-kicker {
      font-family: var(--mono);
      font-size: clamp(9px, 0.72vw, 11px);
      letter-spacing: 0.32em;
      text-transform: uppercase;
    }

    .path-kicker {
      color: rgba(245, 239, 230, 0.74);
    }

    .path-logo {
      display: block;
      width: min(100%, clamp(220px, 24vw, 390px));
      height: auto;
      transition: transform 0.32s ease, filter 0.32s ease, opacity 0.32s ease;
      will-change: transform, filter;
    }

    .path.left .path-logo {
      filter:
        drop-shadow(0 0 18px rgba(255, 255, 255, 0.10))
        drop-shadow(0 0 46px rgba(255, 255, 255, 0.06))
        drop-shadow(0 24px 44px rgba(0, 0, 0, 0.44));
      animation: leftLogoFloat 7.4s ease-in-out infinite;
    }

    .path.right .path-logo {
      width: min(100%, clamp(210px, 22vw, 330px));
      filter:
        drop-shadow(0 0 16px rgba(255, 255, 255, 0.14))
        drop-shadow(0 0 40px rgba(255, 255, 255, 0.08))
        drop-shadow(0 22px 42px rgba(0, 0, 0, 0.40));
      transform-origin: center center;
      animation: rightLogoSpin 30s linear infinite;
    }

    .path:hover .path-logo {
      transform: scale(1.045);
      filter:
        drop-shadow(0 0 24px rgba(255, 255, 255, 0.18))
        drop-shadow(0 0 52px rgba(255, 233, 188, 0.12))
        drop-shadow(0 28px 54px rgba(0, 0, 0, 0.50));
    }

    .path-title {
      margin: 0;
      font-size: clamp(1.4rem, 2.4vw, 2.6rem);
      line-height: 0.94;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-shadow: 0 18px 50px rgba(0, 0, 0, 0.54);
    }

    .path-title-image {
      display: block;
      width: min(100%, clamp(250px, 29vw, 520px));
      max-width: 100%;
      height: auto;
      filter:
        drop-shadow(0 16px 38px rgba(0, 0, 0, 0.58))
        drop-shadow(0 0 18px rgba(255, 255, 255, 0.08));
    }

    .path-wordmark-stack {
      position: relative;
      display: block;
      width: min(100%, clamp(220px, 24vw, 380px));
    }

    .path-wordmark {
      display: block;
      width: 100%;
      height: auto;
    }

    .path-wordmark.base {
      position: relative;
      z-index: 1;
      opacity: 0.86;
      filter:
        drop-shadow(0 12px 28px rgba(0, 0, 0, 0.36))
        drop-shadow(0 0 10px rgba(255, 255, 255, 0.04));
    }

    .path-kicker-signature {
      position: relative;
      display: block;
      width: min(100%, clamp(138px, 15vw, 232px));
      line-height: 0;
      opacity: 0.62;
      pointer-events: none;
    }

    .path-kicker-signature img {
      display: block;
      width: 100%;
      height: auto;
    }

    .path-kicker-signature-base {
      filter:
        grayscale(1)
        invert(1)
        brightness(0.92)
        contrast(1.04)
        drop-shadow(0 0 8px rgba(255, 255, 255, 0.06));
      animation: pathSignatureTone 8.8s ease-in-out infinite;
    }

    .path-kicker-signature-pass {
      position: absolute;
      inset: 0;
      opacity: 0;
      clip-path: inset(0 100% 0 0);
      mix-blend-mode: screen;
      filter:
        grayscale(1)
        invert(1)
        brightness(1.34)
        contrast(1.06)
        drop-shadow(0 0 14px rgba(255, 255, 255, 0.20))
        drop-shadow(0 0 28px rgba(255, 255, 255, 0.10));
      transform: translateX(-1px) scale(1.01);
      transform-origin: left center;
      animation: pathSignatureWriteOn 17.6s cubic-bezier(.2,.72,.18,1) infinite;
    }

    .path-route {
      color: var(--sand);
      opacity: 0.92;
    }

    .path-route::after {
      content: " >>";
      color: rgba(255, 230, 180, 0.88);
    }

    .center-axis {
      position: relative;
      width: 100%;
      height: min(76vh, 720px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .center-axis::before,
    .center-axis::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .center-axis::before {
      width: 1px;
      height: 100%;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0),
        rgba(255, 239, 205, 0.82) 16%,
        rgba(215, 171, 82, 0.95) 50%,
        rgba(255, 239, 205, 0.82) 84%,
        rgba(255, 255, 255, 0)
      );
      box-shadow:
        0 0 12px rgba(215, 171, 82, 0.40),
        0 0 28px rgba(215, 171, 82, 0.18);
      opacity: 0.95;
    }

    .center-axis::after {
      top: 50%;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(255, 234, 194, 0.92) 0%, rgba(215, 171, 82, 0.66) 30%, rgba(215, 171, 82, 0.0) 72%);
      filter: blur(4px);
      box-shadow: 0 0 34px rgba(255, 219, 140, 0.30);
      animation: axisTravel 6.8s ease-in-out infinite;
    }

    .center-kicker {
      position: absolute;
      left: 50%;
      bottom: 8vh;
      transform: translateX(-50%);
      color: rgba(255, 234, 194, 0.68);
      text-align: center;
      white-space: nowrap;
    }

    @keyframes portraitFloat {
      0%,
      100% {
        transform: scale(1.04) translate3d(0, 0, 0);
      }
      50% {
        transform: scale(1.065) translate3d(0, -12px, 0);
      }
    }

    @keyframes storefrontFloat {
      0%,
      100% {
        transform: scale(1.06) translate3d(0, 0, 0);
      }
      50% {
        transform: scale(1.085) translate3d(0, -8px, 0);
      }
    }

    @keyframes thirdFloat {
      0%,
      100% {
        transform: scale(1.05) translate3d(0, 0, 0);
      }
      50% {
        transform: scale(1.08) translate3d(0, -10px, 0);
      }
    }

    @keyframes fourthFloat {
      0%,
      100% {
        transform: scale(1.045) translate3d(0, 0, 0);
      }
      50% {
        transform: scale(1.07) translate3d(0, -9px, 0);
      }
    }

    @keyframes backgroundSwapPortrait {
      0%,
      20% {
        opacity: 0.6;
      }
      25%,
      100% {
        opacity: 0;
      }
    }

    @keyframes backgroundSwapStorefront {
      0%,
      20% {
        opacity: 0;
      }
      25%,
      45% {
        opacity: 0.56;
      }
      50%,
      100% {
        opacity: 0;
      }
    }

    @keyframes backgroundSwapThird {
      0%,
      45% {
        opacity: 0;
      }
      50%,
      70% {
        opacity: 0.58;
      }
      75%,
      100% {
        opacity: 0;
      }
    }

    @keyframes backgroundSwapFourth {
      0%,
      70% {
        opacity: 0;
      }
      75%,
      95% {
        opacity: 0.54;
      }
      100% {
        opacity: 0;
      }
    }

    @keyframes shirtPulse {
      0%,
      100% {
        opacity: 0.66;
        transform: scale(1) translate3d(0, 0, 0);
      }
      50% {
        opacity: 0.9;
        transform: scale(1.03) translate3d(0, 5px, 0);
      }
    }

    @keyframes axisTravel {
      0%,
      100% {
        opacity: 0.66;
        transform: translate(-50%, calc(-1 * var(--orb-travel))) scale(0.88);
      }
      50% {
        opacity: 1;
        transform: translate(-50%, var(--orb-travel)) scale(1.12);
      }
    }

    @keyframes leftLogoFloat {
      0%,
      100% {
        transform: translate3d(0, 0, 0);
      }
      50% {
        transform: translate3d(0, -10px, 0);
      }
    }

    @keyframes envyShadowDrift {
      0%,
      100% {
        transform: translate3d(-8px, 8px, 0) scale(1.05);
      }
      25% {
        transform: translate3d(2px, -5px, 0) scale(1.08);
      }
      50% {
        transform: translate3d(10px, 2px, 0) scale(1.04);
      }
      75% {
        transform: translate3d(1px, 10px, 0) scale(1.07);
      }
    }

    @keyframes envyBaseFade {
      0%,
      100% {
        opacity: 0.8;
      }
      35% {
        opacity: 0.8;
      }
      50% {
        opacity: 0.18;
      }
      65% {
        opacity: 0.18;
      }
    }

    @keyframes envyWhiteFade {
      0%,
      100% {
        opacity: 0;
      }
      35% {
        opacity: 0;
      }
      50% {
        opacity: 0.98;
      }
      65% {
        opacity: 0.98;
      }
    }

    @keyframes pathSignatureTone {
      0%,
      100% {
        filter:
          grayscale(1)
          invert(1)
          brightness(0.72)
          contrast(1.02)
          drop-shadow(0 0 6px rgba(255, 255, 255, 0.02));
      }

      50% {
        filter:
          grayscale(1)
          invert(1)
          brightness(1.10)
          contrast(1.03)
          drop-shadow(0 0 10px rgba(255, 255, 255, 0.12));
      }
    }

    @keyframes pathSignatureWriteOn {
      0%,
      46% {
        opacity: 0;
        clip-path: inset(0 100% 0 0);
        transform: translateX(-2px) scale(1.01);
      }

      49% {
        opacity: 0;
        clip-path: inset(0 100% 0 0);
        transform: translateX(-2px) scale(1.01);
      }

      54% {
        opacity: 0.84;
        clip-path: inset(0 74% 0 0);
        transform: translateX(-1px) scale(1.01);
      }

      61% {
        opacity: 0.96;
        clip-path: inset(0 34% 0 0);

    (function () {
      function tryImageSources(candidates, onSuccess) {
        var index = 0;

        function attemptNext() {
          if (index >= candidates.length) return;

          var src = candidates[index++];
          var probe = new Image();

          probe.onload = function () {
            onSuccess(src);
          };

          probe.onerror = attemptNext;
          probe.src = src;
        }

        attemptNext();
      }

      function applyImageCandidate(selector, candidates) {
        tryImageSources(candidates, function (src) {
          document.querySelectorAll(selector).forEach(function (element) {
            element.setAttribute("src", src);
          });
        });
      }

      var backgroundMusic = document.getElementById("backgroundMusic");
      var backgroundMusicTimeKey = "siteflow_music_time";
      var soundPlayerVolumeKey = "siteflow_music_volume";
      var backgroundMusicLastSavedAt = 0;
      var soundPlayerTracks = [
        {
          title: "NATE SAVARD — CHOSEN FEW / SONG 3",
          src: "Song%203%20FULLLL.mp3"
        }
      ];
      var soundPlayerTrackIndex = 0;
      var soundPlayerPlay = document.getElementById("soundPlayerPlay");
      var soundPlayerPrevious = document.getElementById("soundPlayerPrevious");
      var soundPlayerNext = document.getElementById("soundPlayerNext");
      var soundPlayerSeek = document.getElementById("soundPlayerSeek");
      var soundPlayerVolume = document.getElementById("soundPlayerVolume");
      var soundPlayerStatus = document.getElementById("soundPlayerStatus");
      var soundPlayerTime = document.getElementById("soundPlayerTime");
      var soundPlayerTrackNumber = document.getElementById("soundPlayerTrackNumber");
      var soundPlayerTrackTitle = document.getElementById("soundPlayerTrackTitle");

      function getSoundPlayerTrack() {
        return soundPlayerTracks[soundPlayerTrackIndex];
      }

      function formatSoundPlayerTime(seconds) {
        var safeSeconds = Number.isFinite(seconds) && seconds >= 0 ? Math.floor(seconds) : 0;
        var minutes = Math.floor(safeSeconds / 60);
        var remainder = safeSeconds % 60;
        return String(minutes).padStart(2, "0") + ":" + String(remainder).padStart(2, "0");
      }

      function syncSoundPlayer() {
        if (!backgroundMusic) return;

        var track = getSoundPlayerTrack();
        var isPlaceholder = !track || !track.src;
        var duration = Number(backgroundMusic.duration || 0);
        var current = Number(backgroundMusic.currentTime || 0);
        var isPlaying = !isPlaceholder && !backgroundMusic.paused && !backgroundMusic.ended;

        if (soundPlayerPlay) {
          soundPlayerPlay.innerHTML = isPlaying ? "&#10074;&#10074;" : "&#9654;";
          soundPlayerPlay.setAttribute("aria-label", isPlaying ? "Pause track" : "Play track");
          soundPlayerPlay.setAttribute("aria-pressed", isPlaying ? "true" : "false");
        }

        if (soundPlayerTrackNumber) {
          soundPlayerTrackNumber.textContent = String(soundPlayerTrackIndex + 1).padStart(2, "0") + "/" + soundPlayerTracks.length;
        }

        if (soundPlayerTrackTitle) {
          soundPlayerTrackTitle.textContent = track ? track.title : "NO TRACK";
        }

        if (soundPlayerStatus) {
          if (isPlaceholder) {
            soundPlayerStatus.textContent = "NO TRACK";
          } else if (isPlaying) {
            soundPlayerStatus.textContent = "PLAYING";
          } else if (backgroundMusic.networkState === 3) {
            soundPlayerStatus.textContent = "LOAD ERROR";
          } else if (backgroundMusic.readyState < 1) {
            soundPlayerStatus.textContent = "LOADING";
          } else {
            soundPlayerStatus.textContent = current > 0 ? "PAUSED" : "READY";
          }
        }

        if (soundPlayerTime) {
          soundPlayerTime.textContent = isPlaceholder
            ? "--:-- / --:--"
            : formatSoundPlayerTime(current) + " / " + (duration ? formatSoundPlayerTime(duration) : "--:--");
        }

        if (soundPlayerSeek) {
          soundPlayerSeek.value = duration ? String(Math.round((current / duration) * 1000)) : "0";
          soundPlayerSeek.disabled = isPlaceholder;
        }
      }

      function saveBackgroundMusicPosition(force) {
        if (!backgroundMusic || soundPlayerTrackIndex !== 0) return;

        var current = Number(backgroundMusic.currentTime || 0);
        if (!Number.isFinite(current)) return;
        if (!force && Math.abs(current - backgroundMusicLastSavedAt) < 0.75) return;
        backgroundMusicLastSavedAt = current;

        try {
          window.localStorage.setItem(backgroundMusicTimeKey, String(current));
        } catch (error) {
          return;
        }
      }

      function bindBackgroundMusicPersistence() {
        if (!backgroundMusic || backgroundMusic.dataset.musicStateBound === "true") return;

        backgroundMusic.dataset.musicStateBound = "true";

        function restoreBackgroundMusicPosition() {
          if (soundPlayerTrackIndex !== 0) return;

          var stored = 0;
          try {
            stored = Number(window.localStorage.getItem(backgroundMusicTimeKey) || "0");
          } catch (error) {
            return;
          }

          var duration = Number(backgroundMusic.duration || 0);
          if (!Number.isFinite(stored) || stored <= 0.15) return;
          if (duration && stored >= duration - 0.5) return;

          try {
            backgroundMusic.currentTime = stored;
          } catch (error) {
            return;
          }
        }

        backgroundMusic.addEventListener("loadedmetadata", restoreBackgroundMusicPosition);
        backgroundMusic.addEventListener("loadedmetadata", syncSoundPlayer);
        backgroundMusic.addEventListener("loadstart", syncSoundPlayer);
        backgroundMusic.addEventListener("canplay", syncSoundPlayer);
        backgroundMusic.addEventListener("error", syncSoundPlayer);
        backgroundMusic.addEventListener("timeupdate", function () {
          saveBackgroundMusicPosition(false);
          syncSoundPlayer();
        });
        backgroundMusic.addEventListener("play", function () {
          syncSoundPlayer();
        });
        backgroundMusic.addEventListener("pause", function () {
          syncSoundPlayer();
        });
        backgroundMusic.addEventListener("ended", function () {
          try {
            window.localStorage.setItem(backgroundMusicTimeKey, "0");
          } catch (error) {
            // Continue to the next playlist slot even if storage is unavailable.
          }

          loadSoundPlayerTrack(soundPlayerTrackIndex + 1, true);
        });

        window.addEventListener("pagehide", function () {
          saveBackgroundMusicPosition(true);
        });

        document.addEventListener("visibilitychange", function () {
          if (document.hidden) saveBackgroundMusicPosition(true);
        });

        restoreBackgroundMusicPosition();
      }

      function playSoundPlayerTrack() {
        var track = getSoundPlayerTrack();
        if (!backgroundMusic || !track || !track.src) {
          syncSoundPlayer();
          return;
        }

        backgroundMusic.muted = false;
        var playAttempt = backgroundMusic.play();
        if (playAttempt && typeof playAttempt.then === "function") {
          playAttempt.then(syncSoundPlayer).catch(syncSoundPlayer);
        }
      }

      function loadSoundPlayerTrack(index, shouldPlay) {
        if (!backgroundMusic) return;

        saveBackgroundMusicPosition(true);
        backgroundMusic.pause();
        soundPlayerTrackIndex = (index + soundPlayerTracks.length) % soundPlayerTracks.length;

        var track = getSoundPlayerTrack();
        backgroundMusic.currentTime = 0;

        if (!track.src) {
          backgroundMusic.removeAttribute("src");
          backgroundMusic.load();
          syncSoundPlayer();
          return;
        }

        backgroundMusic.src = track.src;
        backgroundMusic.load();
        syncSoundPlayer();

        if (shouldPlay) {
          playSoundPlayerTrack();
        }
      }

      applyImageCandidate(".path-official-logo", [
        "envy-nomadix-chrome-signature-cutout.png",
        "envynomadix-logo-no-bg.png",
        "envy-nomadix-worldwide-signature.png"
      ]);

      applyImageCandidate(".path-wordmark.base", [
        "ENVY NOMADIX ANGELS (1).png"
      ]);

      tryImageSources([
        "nate-savard-warm-portrait-3000(1).png",
        "nate-savard-forever.png",
        "nate savard forever.png"
      ], function (src) {
        document.documentElement.style.setProperty("--entry-portrait-image", 'url("' + src + '")');
      });

      tryImageSources([
        "IMG_6721.jpg",
        "turkey-nate-savard-1.png",
        "Turkey Nate Savard (1).png",
        "turkey-nate-savard.png",
        "Turkey Nate Savard.png"
      ], function (src) {
        document.documentElement.style.setProperty("--entry-storefront-image", 'url("' + src + '")');
      });

      tryImageSources([
        "nate-savard-bg-3.png",
        "nate savard bg 3.png"
      ], function (src) {
        document.documentElement.style.setProperty("--entry-third-image", 'url("' + src + '")');
      });

      tryImageSources([
        "nate savard speedway (1).png",
        "nate-savard-speedway-1.png"
      ], function (src) {
        document.documentElement.style.setProperty("--entry-fourth-image", 'url("' + src + '")');
      });

      document.querySelectorAll(".path").forEach(function (link) {
        link.addEventListener("click", function () {
          saveBackgroundMusicPosition(true);
        }, { capture: true });
      });

      if (soundPlayerPlay) {
        soundPlayerPlay.addEventListener("click", function () {
          var track = getSoundPlayerTrack();
          if (!backgroundMusic || !track || !track.src) {
            syncSoundPlayer();
            return;
          }

          if (backgroundMusic.paused) {
            playSoundPlayerTrack();
            return;
          }

          backgroundMusic.pause();
        });
      }

      if (soundPlayerPrevious) {
        soundPlayerPrevious.addEventListener("click", function () {
          if (!backgroundMusic) return;

          var track = getSoundPlayerTrack();
          var wasPlaying = !!track.src && !backgroundMusic.paused;

          if (track.src && backgroundMusic.currentTime > 3) {
            backgroundMusic.currentTime = 0;
            syncSoundPlayer();
            return;
          }

          loadSoundPlayerTrack(soundPlayerTrackIndex - 1, wasPlaying);
        });
      }

      if (soundPlayerNext) {
        soundPlayerNext.addEventListener("click", function () {
          if (!backgroundMusic) return;

          var track = getSoundPlayerTrack();
          var wasPlaying = !!track.src && !backgroundMusic.paused;
          loadSoundPlayerTrack(soundPlayerTrackIndex + 1, wasPlaying);
        });
      }

      if (soundPlayerSeek) {
        soundPlayerSeek.addEventListener("input", function () {
          if (!backgroundMusic || !backgroundMusic.duration) return;
          backgroundMusic.currentTime = (Number(soundPlayerSeek.value || 0) / 1000) * backgroundMusic.duration;
          syncSoundPlayer();
        });
      }

      if (soundPlayerVolume) {
        soundPlayerVolume.addEventListener("input", function () {
          if (!backgroundMusic) return;
          backgroundMusic.muted = false;
          backgroundMusic.volume = Number(soundPlayerVolume.value || 0) / 100;

          try {
            window.localStorage.setItem(soundPlayerVolumeKey, String(backgroundMusic.volume));
          } catch (error) {
            // Volume still works when storage is unavailable.
          }
        });
      }

      bindBackgroundMusicPersistence();

      if (backgroundMusic && soundPlayerVolume) {
        var storedVolume = 0.9;

        try {
          storedVolume = Number(window.localStorage.getItem(soundPlayerVolumeKey) || "0.9");
        } catch (error) {
          storedVolume = 0.9;
        }

        if (!Number.isFinite(storedVolume) || storedVolume < 0 || storedVolume > 1) {
          storedVolume = 0.9;
        }

        backgroundMusic.volume = storedVolume;
        soundPlayerVolume.value = String(Math.round(storedVolume * 100));
      }

      loadSoundPlayerTrack(0, false);
    })();

/* NS85 V6 — hooks existing backgroundMusic; never introduces audio */
(()=>{'use strict';const init=()=>{
const audio=document.getElementById('backgroundMusic'),old=document.querySelector('.sound-player'),nativePlay=document.getElementById('soundPlayerPlay'),nativeTitle=document.getElementById('soundPlayerTrackTitle'),nativeVolume=document.getElementById('soundPlayerVolume');
if(!audio||!old||!nativePlay){console.warn('NS85 V6: original player unavailable');return;}
document.getElementById('ns85-v5')?.remove();
const ui=document.createElement('aside');ui.id='ns85-v5';ui.className=window.matchMedia('(max-width: 680px)').matches?'':'is-min';ui.setAttribute('aria-label','NS Audio 85');
ui.innerHTML=`<section class="ns-expanded"><img class="ns-art ns-logo" src="/logo.png" alt=""><img class="ns-art ns-divider-a" src="/divider.png" alt=""><button class="ns-control ns-play" type="button" aria-label="Play"><img src="/play.png" alt=""></button><button class="ns-control ns-stop" type="button" aria-label="Stop"><img src="/stop.png" alt=""></button><div class="ns-readout"><span class="ns-title">NATE SAVARD</span><span class="ns-subtitle">NS COLLECTIVE</span><span class="ns-time">00:00 / --:--</span></div><input class="ns-seek" type="range" min="0" max="1000" value="0" aria-label="Track position"><img class="ns-art ns-divider-b" src="/divider.png" alt=""><svg class="ns-speaker" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12" stroke-linecap="round" stroke-linejoin="round"/></svg><input class="ns-volume" type="range" min="0" max="100" value="90" aria-label="Volume"><button class="ns-minimize" type="button" aria-label="Minimize">−</button></section><button class="ns-minimized" type="button" aria-label="Expand NS Audio 85 player"></button><button class="ns-mini-play" type="button" aria-label="Play music"></button>`;
document.body.appendChild(ui);
const $=s=>ui.querySelector(s),seek=$('.ns-seek'),vol=$('.ns-volume'),play=$('.ns-play'),tab=$('.ns-minimized');
tab.onclick=()=>{ui.classList.remove('is-min');play.focus({preventScroll:true})};$('.ns-mini-play').onclick=(event)=>{event.stopPropagation();nativePlay.click()};$('.ns-minimize').onclick=()=>{ui.classList.add('is-min');tab.focus({preventScroll:true})};
play.onclick=()=>nativePlay.click();$('.ns-stop').onclick=()=>{audio.pause();try{audio.currentTime=0}catch(_){}};
seek.oninput=()=>{if(Number.isFinite(audio.duration)&&audio.duration>0)audio.currentTime=audio.duration*Number(seek.value)/1000};
vol.oninput=()=>{if(nativeVolume){nativeVolume.value=vol.value;nativeVolume.dispatchEvent(new Event('input',{bubbles:true}))}else{audio.muted=false;audio.volume=Number(vol.value)/100}vol.style.setProperty('--fill',vol.value+'%')};
const fmt=n=>Number.isFinite(n)&&n>=0?String(Math.floor(n/60)).padStart(2,'0')+':'+String(Math.floor(n%60)).padStart(2,'0'):'--:--';
function render(){const dur=audio.duration,cur=audio.currentTime||0;$('.ns-title').textContent=nativeTitle?.textContent?.trim()||'NATE SAVARD';$('.ns-time').textContent=fmt(cur)+' / '+fmt(dur);if(document.activeElement!==seek){seek.value=Number.isFinite(dur)&&dur>0?String(Math.round(cur/dur*1000)):0;seek.style.setProperty('--fill',Number(seek.value)/10+'%')}seek.disabled=!(Number.isFinite(dur)&&dur>0);if(document.activeElement!==vol){vol.value=Math.round(audio.volume*100);vol.style.setProperty('--fill',vol.value+'%')}play.setAttribute('aria-label',audio.paused?'Play':'Pause');$('.ns-mini-play').setAttribute('aria-label',audio.paused?'Play music':'Pause music')}
for(const e of ['play','pause','timeupdate','loadedmetadata','durationchange','volumechange','ended'])audio.addEventListener(e,render);if(nativeTitle)new MutationObserver(render).observe(nativeTitle,{childList:true,subtree:true,characterData:true});render();document.documentElement.classList.add('ns85-v5-ready');
// Attempt audible autoplay once. Mobile Safari normally blocks it until a tap.
// Rejection is expected: keep the expanded Play button available.
if(audio.paused){try{const attempt=audio.play();if(attempt&&typeof attempt.catch==='function')attempt.catch(()=>{/* browser blocked autoplay; visitor can press Play */})}catch(_){/* no autoplay permission */}}
};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();})();

</script>
<style id="ns85-mobile-brand-position">
@media screen and (max-width:680px){.entry-gate{transform:translateY(-85px)}}
@media screen and (max-width:680px) and (max-height:650px){.entry-gate{transform:translateY(-45px)}}
</style>
</body>
</html>
