<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>Lost Dimensions: Insomnia 2026 — Nate Savard</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; overflow: hidden; display: grid; place-items: center;
      background: linear-gradient(rgba(0,0,0,.46), rgba(0,0,0,.76)), url("nate-savard-bg-3.png") center / cover no-repeat #050505;
      color: #fff; font-family: Arial, Helvetica, sans-serif;
    }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .42; background: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 4px); }
    main { position: relative; z-index: 1; width: min(900px, calc(100vw - 36px)); text-align: center; text-shadow: 0 4px 28px #000; }
    .kicker { margin: 0 0 22px; font: 700 clamp(10px,1.2vw,13px)/1.2 "Courier New", monospace; letter-spacing: .34em; }
    h1 { margin: 0; font-size: clamp(2.2rem, 7vw, 6.5rem); line-height: .88; letter-spacing: -.045em; text-transform: uppercase; }
    .jp { margin: 25px 0 0; font-size: clamp(14px, 2vw, 21px); letter-spacing: .18em; }
    .code { margin: 48px 0 0; font: 700 12px/1 "Courier New", monospace; letter-spacing: .5em; }
    .return { position: fixed; right: 18px; bottom: 15px; left: 18px; color: #fff; text-align: center; text-decoration: none; font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    .return:hover, .return:focus-visible { color: #d7ab52; outline: none; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">NATE SAVARD PRESENTS</p>
    <h1>Lost Dimensions<br>Insomnia 2026</h1>
    <p class="jp">ロスト・ディメンションズ / インソムニア</p>
    <p class="code">N L S M 85</p>
  </main>
  <a class="return" href="index.html">NATE SAVARD</a>
</body>
</html>
